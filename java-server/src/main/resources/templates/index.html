<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ditto Spring Tasks Quickstart</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.2"></script>
</head>
<body>
    <!-- The server streams the real control (current state label + a Start/Stop
         action button) over SSE. Until the actual state is known, the control is
         withheld: a neutral placeholder with a disabled button, never a hard-coded
         state. The first "sync_state" event replaces this with the live control. -->
    <div id="sync-header"
         hx-ext="sse"
         sse-connect="/ditto/sync/state"
         sse-swap="sync_state"
         style="margin-bottom: 1rem;">
        <span>Sync State: &hellip;</span>
        <button type="button" disabled>&hellip;</button>
    </div>

    <div style="display: flex; gap: 2rem;">
        <div id="list-section" style="flex: 1;"
             hx-ext="sse"
             sse-connect="/tasks/stream"
             sse-swap="task_list">
            <div th:replace="fragments/taskList :: taskListFrag(${tasks})"></div>
        </div>

       <div id="form-section" style="flex: 1;">
            <h3>Add new Task</h3>
            <form hx-post="/tasks" hx-swap="none"
                  hx-on::after-request="if(event.detail.successful) this.reset()">
                <input type="text" name="title" placeholder="Task description..." required />
                <button type="submit">Add</button>
            </form>
        </div>
    </div>
    <script>
        document.body.addEventListener('htmx:sseBeforeMessage', function (e) {
            // Debug SSE Events
            console.log(e)
        })
    </script>
</body>
</html>
