//file:noinspection GrPackage

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// Ditto v5 requires minSdkVersion 24+ (ditto-internal-rustls:5.0.0).
// Flutter plugins default their own androidTest minSdkVersion to 23, which
// breaks the manifest merger. Bump every Android subproject (notably
// :ditto_live) to match.
subprojects {
    // :app sets its own minSdkVersion and is already evaluated (forced by
    // evaluationDependsOn above); registering afterEvaluate on an already-
    // evaluated project throws in Gradle 8.10. Skip it here — only plugin
    // library subprojects (e.g. :ditto_live) need the bump.
    if (project.name == 'app') return

    afterEvaluate { project ->
        if (project.plugins.hasPlugin('com.android.application') ||
                project.plugins.hasPlugin('com.android.library')) {
            project.android {
                defaultConfig {
                    if (minSdkVersion == null || minSdkVersion.apiLevel < 24) {
                        minSdkVersion 24
                    }
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
